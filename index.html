  if (path === '/health') return json({ ok: true, configured: false, demo: true });
  if (path === '/demo/session') return json({ token: 'offline-demo-only' });
  if (path === '/workspace') return json({ user: db.staff[0], demo: true, data: { ...db, documents: db.documents.map(({ fileUrl, ...d }) => ({ ...d, hasFile: !!fileUrl })) } });

  if (record && Object.hasOwn(db, record[1])) {

    const index = db[collection].findIndex(r => r.id === id);

    if (method === 'DELETE') { if (previous) previous.active = false; return json({ ok: true }); }

    const code = 'DEMO-' + random().match(/.{4}/g).join('-');
    const selected = db.documents.filter(d => d.caseId === matter.id && data.documentIds?.includes(d.id) && d.fileUrl);

    const key = normalize(code); shares[key] = value; activeCodeByCase[matter.id] = key;
    return json({ code, expiresAt: value.expiresAt, snapshot, demo: true });
  }
  if (path === '/portal/lookup' || path === '/portal/download') {
    const shared = shares[normalize(data.code)];
    if (!shared?.active || new Date(shared.expiresAt) <= new Date()) return json({ error: 'Không tìm thấy hồ sơ được chia sẻ. Vui lòng kiểm tra mã được cấp.' }, 404);
    if (path.endsWith('download')) {
      const doc = db.documents.find(d => d.id === data.documentId && d.caseId === shared.caseId);
      if (!shared.documents.some(d => d.id === data.documentId) || !doc || doc.fileHash !== shared.fileHashes[doc.id]) return json({ error: 'Tài liệu không được chia sẻ hoặc đã thay đổi.' }, 404);
      return fileResponse(doc);
    }
    const { selection, fileHashes, active, ...snapshot } = shared;
    return json(snapshot);
  }
  return json({ error: 'Tính năng này cần máy chủ thật và không được kết nối trong bản demo HTML.' }, 404);
};
